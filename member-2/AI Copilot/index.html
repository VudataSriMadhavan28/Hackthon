<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Copilot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <a href="../../index.html" class="logo">
        ✦ AI Interfaces
    </a>

    <a href="../../index.html" class="back-btn">
        ← Back to Home
    </a>

</header>


<main>

    <section class="copilot-page">

        <div class="hero-content">

            <div class="badge">
                ✦ AI COPILOT
            </div>

            <h1>
                Your intelligent
                <span>AI Copilot</span>
            </h1>

            <p>
                Work faster, create smarter and get intelligent
                assistance wherever you need it.
            </p>

        </div>


        <div class="copilot-layout">

            <!-- SIDEBAR -->

            <aside class="sidebar">

                <h3>
                    Copilot
                </h3>

                <button class="side-item active">
                    ✨ Overview
                </button>

                <button class="side-item">
                    📝 Writing
                </button>

                <button class="side-item">
                    💡 Ideas
                </button>

                <button class="side-item">
                    📊 Analyze
                </button>

                <button class="side-item">
                    ⚡ Automate
                </button>

            </aside>


            <!-- MAIN COPILOT -->

            <section class="copilot-card">

                <div class="card-header">

                    <div>
                        <span class="online-dot"></span>
                        AI Copilot
                    </div>

                    <span class="status">
                        Online
                    </span>

                </div>


                <div class="welcome">

                    <div class="ai-avatar">
                        ✦
                    </div>

                    <h2>
                        How can I help?
                    </h2>

                    <p>
                        Ask me anything or choose an action below.
                    </p>

                </div>


                <div class="suggestions">

                    <button class="suggestion">
                        ✍️ Write something
                    </button>

                    <button class="suggestion">
                        💡 Generate ideas
                    </button>

                    <button class="suggestion">
                        📊 Analyze data
                    </button>

                    <button class="suggestion">
                        📝 Summarize text
                    </button>

                </div>


                <div class="input-area">

                    <textarea
                        id="copilotInput"
                        placeholder="Ask your AI Copilot anything..."
                    ></textarea>

                    <button id="sendBtn" class="send-btn">
                        Send ✦
                    </button>

                </div>

                <div id="response" class="response"></div>

            </section>

        </div>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
